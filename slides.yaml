## 5.3 Current Validation Conclusions

Validation completed the Initial Validation of Model-7468 GenAI Selling Points, covering the model's generation of selling points for the three Elavon products within the scope defined in Section 2 of this validation report. The assessment drew on the Model Development Document, the production code and configuration, the reported subject matter expert review results, sample outputs, Validation's independent review of the full cached model output, and discussions with the Model Owner (MO) and Model Developer (MD).

The outcome is **Approved with Restriction**. The approval rests on the following. The modeling framework is conceptually sound for the stated business purpose, and the recommendation step is deterministic. The model is internally facing, does not interact with customers, and does not decide without manual intervention; bankers review each selling point before use and cannot alter it. Validation independently reviewed all 172 cached selling points against the source documents, the curated selling-points source, and the product database descriptions used in generation, and this independent review is the primary performance evidence for this validation. The review identified three selling points, all for Elavon Terminal, with unqualified cost phrasing; Validation traced the error to the recommender input data, the business line acknowledged the error, and the correction is tracked to closure under the High Priority Finding on Performance of Estimation Method. The risk rating recorded in the inventory is Low. On these considerations, continued use of the currently served content is appropriate.

The restriction rests on two areas of concern. The validated scope covers both the cached outputs and outputs regenerated through the model: although outputs are served from a cache, they are not static, because the knowledge base and product documents are maintained over time and regeneration events replace the cached content through the generative pathway. Regenerated content would reach bankers without an effective review before serving and without a monitoring signal capable of detecting a decline in quality, and these outputs describe product capabilities and pricing that bankers present to customers. Sustained output quality therefore depends on the two areas of control below, beyond the point-in-time coverage of Validation's review.
1. Performance evidence and controls, recorded in the High Priority Finding on Performance of Estimation Method. The subject matter expert review was not demonstrated to operate as an effective control over served content: the reviewer produced no record of the review, meaning no per-row outcome, no rationale, and no comments, and the pass entries in the results file were not created by the reviewer. The recorded outcome does not determine whether content is served, with content regenerated in each environment including production and no review step before serving. The pilot period demonstrated this gap in operation, as the rebranded cache was served without subject matter expert review, so unreviewed generated content reached bankers. The automated testing framework was not demonstrated to detect quality issues. The assessment is not comprehensive: it primarily evaluates content quality and persuasiveness rather than the reliability attributes that matter for a retrieval-augmented model, namely grounding, faithfulness, retrieval quality, and traceability. The results it did produce did not withstand review: the published automated performance results could not be replicated from the underlying output records, the MD stated the published values were erroneous and withdrew them as evidence with no revised results provided, and the effectiveness score attached to each output is returned in the same model call and prompt that generates the selling point, so it is not an independent evaluation, with no evidence provided that it distinguishes effective from ineffective selling points. Because of these gaps in both the subject matter expert review and the automated testing framework, Validation's independent review is the primary performance evidence for this validation.
2. Ongoing monitoring, recorded in the Moderate Priority Finding on Monitoring. The monitoring plan does not yet establish reliable and actionable performance signals or valid baselines. The primary automated quality metric provides weak discrimination, the structured feedback is oriented to the product recommendation rather than the generated selling point, and the free-text feedback that could serve as a selling-point quality signal carries no defined threshold or acceptance criteria. The methodology for aggregating metrics and determining breaches is ambiguous, and the stated baselines rest on evaluation results the MD withdrew.

The remaining gaps support the two areas above and do not independently drive the restriction. They are recorded in two Moderate Priority Findings and one Low Priority Finding, tracked to closure through the standard issue-management process (Section 5.4 of this validation report):
- Documentation Transparency and Robustness (Moderate): the documentation does not fully reflect the model as built.
- Implementation Process (Moderate): the implementation document does not fully describe the implementation framework and controls.
- Coding and Calculation Errors (Low): coding errors disable a committed feedback control and introduce evaluation-code defects, and inactive code paths remain in the production code.

On this basis, the production use of the model to generate selling points for the three Elavon products is approved for six months, from 07/31/2026 through 01/31/2027. Lifting the restriction requires closure of the High Priority Finding on Performance of Estimation Method and the Moderate Priority Finding on Monitoring; if both Findings are not closed by 01/31/2027, production use is to cease pending remediation. The next validation activities are stated in Section 3 of this validation report.

