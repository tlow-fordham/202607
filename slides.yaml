**Current Validation Outcome (template field rows):**

**Validation Outcome:** Approved with Restriction

**Rationale for Validation Outcome:** The Initial Validation concludes with an "Approved with Restriction" outcome for production use of the model to generate selling points for the three Elavon products, namely Elavon Mobile, Elavon Terminal, and Elavon Register.

The approval rests on the following considerations. The modeling framework is conceptually sound and appropriate for the stated business purpose. Validation independently reviewed every selling point currently served in production, and each selling point is reviewed by the banker before it is used with a customer, so no model output reaches a customer without human review. On this basis, continued use of the currently served content is appropriate.

The restriction limits the approval to a six-month period, from 07/31/2026 through 01/31/2027, because the controls that would detect a decline in output quality were not demonstrated to be effective. Although outputs are served from a cache, they are not static: the knowledge base and product documents are maintained over time, and regeneration events replace the cached content through the generative pathway, so output quality must be sustained by controls rather than by the one-time review. Two concerns drive the time bound. First, the subject matter expert review of generated content was not demonstrated to be an effective control; the retained evidence does not show meaningful challenge, modification, or enhancement of the generated content. Second, the automated testing framework is not sufficient: the available metrics lacked demonstrated effectiveness as indicators of output quality, and the reported performance results could not be reproduced from the underlying output records. Because these are the controls that would detect quality issues in regenerated content, production use is supported only for a limited period. Use beyond the restriction period requires closure of the High Priority Finding on Performance of Estimation Method, which would establish the effectiveness of these controls. See Sections 5.3 and 5.4 of this validation report for more details.

**Restriction Category:** Time-Bound or Single-Use Restriction

**Restriction Effective Date:** The following date: 01/31/2027. (Per the template footnote, for a time-bound restriction the effective date is the date of last approved use, the end of the six-month window.)

**Restriction Description:** The production use of the model to generate selling points for the three Elavon products is approved for six months, from 07/31/2026 through 01/31/2027. Lifting the restriction requires closure of the High Priority Finding on Performance of Estimation Method; if the Finding is not closed by 01/31/2027, production use is to cease pending remediation. The four Moderate Priority Findings are tracked to closure through the standard issue-management process.

**Recommendation for Additional Validation Activities:** No additional validation activity is recommended. The Part 2 implementation verification and testing, a standard post-approval item, remains outstanding and is due approximately 90 days after implementation (Section 11.3).

**Key Assumptions, Limitations, and Weaknesses:**

Assumptions:
- Output quality depends on knowledge base accuracy and currency and on the product database descriptions injected into the generation prompt.
- Generative phrasing varies, mitigated by low temperature and caching.
- Content is regenerated within each environment, so cached content is replaced through the generative pathway on regeneration events.

Limitations:
- Domain coverage is limited to the documented products.
- Provenance is not exposed in the user interface.
- The structured feedback is oriented to the product recommendation and the free-text feedback is sparse, which limits the selling-point quality signal.

Weaknesses:
- The control and evidence deficiencies identified by this validation are recorded in the five Findings in Section 5.4 of this validation report.

