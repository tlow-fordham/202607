Internal working draft. Component of the Model-7468 GenAI Selling Points Initial Validation report. Part I.

# 4 Modeling Framework and Business Uses

**Model objective and usage**

Model-7468 GenAI Selling Points is an internally developed new model consisting of a single estimation method under one Model ID, with no sub-models or segments. It generates personalized, product-specific selling points for Business Banking customers from customer attributes and underlying product documentation, supporting Sales and Business Banking teams. The model replaces a manual process in which selling points were written by hand from standard copy templates; there is no incumbent automated system performing this function.

The business line's stated objective for the model is to improve on the manual process in four respects:
1. Personalizing messaging at scale across diverse customer profiles.
2. Grounding selling points in current product capabilities through retrieval-augmented generation.
3. Maintaining consistency with compliance and brand standards.
4. Reducing the operational effort of manual selling-point creation.

Outputs are internal-facing. They are surfaced to bankers within the Salesforce recommendation workflow through an application programming interface (API), and the model does not interact with customers. The scope covers Business Banking customers across the supported industries and revenue bands, mapped to the three documented Elavon payment products (Elavon Mobile, Elavon Terminal, and Elavon Register). The knowledge base is a small set of product documents (generic Talech documents rebranded to Elavon during processing) together with a curated selling-points source. The model is currently in pilot use from 04/15/2026 through 08/14/2026, restricted to approximately 15 percent of the bankers; per the Model Owner (MO), full launch will expose the model to 527 bankers, nationwide within the United States. The model serves Business Banking customer segments defined by industry (North American Industry Classification System, or NAICS), sub-industry, and revenue band, producing 172 model-generated selling points. The customer and segment counts, the data statistics, and the segment-to-product mapping are set out in Section 7.1 of this validation report.

The scope of this Initial Validation is the model's generation of selling points for the three Elavon products, namely Elavon Mobile, Elavon Terminal, and Elavon Register. Three additional selling points for money-movement products, namely Bill Pay, Payroll, and Enhanced Payments, were compiled by subject matter experts and are stored as static entries in the PostgreSQL database with their own product identifiers; they were added under the Special Purpose Validation extension and are presented directly in the Salesforce interface without passing through the model's generation process. These money-movement selling points are out of scope for this validation and are not assessed in the sections that follow.

**Model framework**

The model uses a hybrid architecture that combines a deterministic product recommender, a retrieval-augmented generation (RAG) component, a foundation large language model (LLM) for generation, and a production cache (see Figure 4.1). At a summary level, a selling point is produced in six steps, detailed in Section 7.3:
1. The deterministic recommender maps the customer's industry (NAICS), sub-industry, and revenue band to a recommended product, product plan (Free, Standard or Premium), and five product features through the predefined mapping table, so identical inputs produce identical product selections.
2. In the document pre-processing stage, GPT-4o creates the product-to-chunk links: it scores each chunk's relevance to each product in the product list, and links at or above the relevance threshold are stored. These links are used downstream in hybrid retrieval.
3. Hybrid retrieval is performed:
   - Dense search: a fixed query template assembles the customer attributes and general product information into a standardized retrieval query (the recommended plan and feature details are excluded from this query and enter at re-ranking). The retrieval query is embedded with the text-embedding-ada-002 model and compared against the product-document chunks in the PostgreSQL vector database; the dense search returns the top 20 chunks.
   - Entity-link retrieval looks up the product-to-chunk links created in step 2 and returns every chunk linked to the recommended product.
4. The combined chunk set from hybrid retrieval above is re-ranked by a multi-factor relevance score that applies documented boosts, penalties, a minimum relevance threshold, and per-document and total chunk limits (Section 7.3), and a final subset of 10 is passed to the LLM for generation of selling points.
5. GPT-4o is used to generate the selling point from a generation prompt assembled separately from the retrieval query; the generation prompt includes the retrieved chunks and the product name and description from the product database.
6. Each output is a structured selling point, comprising a headline, a subheader, a body, bullet points, an optional disclaimer, and the citation identifiers of the documents supplied to generation (Section 8.4), and is served in production from the cache.

This pipeline uses four distinct prompt and template texts: in pre-processing (the ingestion-time link extraction noted in step 2), retrieval (the query template in step 3), generation (the generation prompt in step 5), and evaluation (outside the serving flow above).

Alongside the banker-facing selling point, each stored output record carries an effectiveness score, a value between 0 and 1 returned by the generating model call, and a large language model as-a-judge score produced by a separate evaluation call. Neither is displayed to the banker; both are assessed in Section 8.1 of this validation report.

[INSERT IMAGE HERE: Model-7468 GenAI Selling Points end-to-end architecture]

**Figure 4.1 - Model-7468 GenAI Selling Points end-to-end architecture.** The diagram presents the model in four phases:
- Document pre-processing: document parsing, text chunking and embedding with text-embedding-ada-002, and document metadata extraction using GPT-4o, stored in the PostgreSQL database.
- Product recommender: a recommender interface and recommendation engine driven by the parsed product-recommendation mapping document and the customer profile.
- Selling points generator: template assembly, query embedding with text-embedding-ada-002, database query, context assembly, generation using GPT-4o, post-processing, and the response, which in production is served through the production cache.
- Feedback and analytics: display, and the collection, storage, and analysis of ratings, thumbs up or down, and comments.

The model uses the same foundation model, GPT-4o, for product-to-chunk link extraction and generation, and text-embedding-ada-002 for both document and query embedding. The product-to-chunk link extraction is not depicted as a separate process in the diagram, and the document metadata extraction branch shown in the pre-processing phase is coded but does not populate usable values in production.

The production pathway is cached at serve time. Product recommendations are fixed for each customer segment, and previously generated selling points are returned from a cache keyed by customer segment. The model is static: no automatic recalibration or retraining occurs, and the expected maintenance cycle is an annual review of the model and its supporting content, per the Estimation Method Assessment (EMA). Content generation nonetheless occurs within the production environment as described above. The knowledge base is refreshed on demand, in an event-driven manner when documents are uploaded or removed, with no scheduled batch re-indexing, and the cache is regenerated accordingly.

**Overall Modeling System**

The model has no upstream models, no concurrent models, and no downstream models, and the Model ID covers a single estimation method with no model suite. Its inputs are data: customer attributes are sourced from the ELZ data store, the source system as named in the model documentation, and the recommender mapping is a configured lookup. The downstream consumer is the Salesforce banker workflow, a user-facing system, in which a banker reviews the selling point before use but cannot modify it, as the generated selling points are controlled upstream. The structured feedback collected is oriented to the product recommendation (thumbs up or down, with preset reject reasons); the free-text field can carry comments on either the recommendation or the generated selling point. Because there are no interconnected models, no model system applies (Section 9).

**Key Assumptions and Limitations**

Output quality depends on the accuracy and currency of the knowledge base and of the product database descriptions injected into the generation prompt. Generative phrasing varies between generation events; the low temperature setting bounds that variation, and the cache fixes the served content until the next regeneration. Domain coverage is limited to the documented products. In use, provenance is not exposed to the banker in the user interface, and the captured feedback is oriented to the product recommendation, which limits the selling-point quality signal. The outcome-material items are listed in Section 3, and the assessments are in Sections 7.5, 8, and 12.

